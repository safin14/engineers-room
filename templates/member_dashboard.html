<!DOCTYPE html>
<html>

<head>
    <title>Member Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


    <div class="container mt-4">


        <div class="card shadow-lg mb-4">
            <div class="card-body text-center">

                <h2 class="fw-bold">ENGINEERS ROOM</h2>
                <h4>Member Dashboard</h4>

            </div>
        </div>



        <div class="card shadow mb-4">

            <div class="card-body">

                <h5 class="mb-3">Add Today's Meal</h5>


                <form method="POST" action="/member">


                    <label class="form-label">
                        Meal Date:
                    </label>

                    <input type="date" name="date" class="form-control mb-3" required>


                    <label class="form-label">
                        Morning Meal:
                    </label>

                    <input type="number" name="morning" value="0" min="0" class="form-control mb-3">


                    <label class="form-label">
                        Night Meal:
                    </label>

                    <input type="number" name="night" value="0" min="0" class="form-control mb-3">


                    <button type="submit" class="btn btn-primary w-100">
                        Add Meal
                    </button>


                </form>


            </div>

        </div>





        <div class="card shadow">

            <div class="card-body">


                <h5>Your Meal History</h5>


                <div class="table-responsive">


                    <table class="table table-bordered text-center mt-3">


                        <tr class="table-dark">

                            <th>Morning</th>
                            <th>Night</th>
                            <th>Date</th>

                        </tr>



                        {% for meal in meals %}

                        <tr>

                            <td>{{ meal.morning }}</td>

                            <td>{{ meal.night }}</td>

                            <td>{{ meal.date }}</td>

                        </tr>

                        {% endfor %}



                    </table>


                </div>


            </div>


        </div>



    </div>


</body>

</html>
