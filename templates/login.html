<!DOCTYPE html>
<html>

<head>

    <title>ENGINEERS ROOM Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0d6efd, #198754);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        .logo {
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            font-size: 28px;
            color: #0d6efd;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border-radius: 10px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">🏠</div>

        <div class="title">
            ENGINEERS ROOM
        </div>

        <div class="subtitle">
            Mess Management System
        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Username</label>

                <input type="text" name="username" class="form-control" placeholder="Enter Username" required>

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>

            </div>

            <button class="btn btn-primary btn-login">
                🔐 Login
            </button>

        </form>

        <div class="footer">
            © ENGINEERS ROOM
        </div>

    </div>

</body>

</html>
