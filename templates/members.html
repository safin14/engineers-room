<!DOCTYPE html>
<html>

<head>
    <title>Members</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .topbar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            padding: 20px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
        }

        .menu {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .menu .btn {
            border-radius: 25px;
            font-weight: 600;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }

        table {
            margin-bottom: 0;
        }
    </style>

</head>

<body>

    <div class="topbar">

        <h3 class="mb-1">👥 Members</h3>

        <p class="mb-0">ENGINEERS ROOM</p>

        <div class="menu">

            <a href="/dashboard" class="btn btn-light">🏠 Dashboard</a>

            <a href="/members" class="btn btn-warning">👥 Members</a>

            <a href="/payment" class="btn btn-light">💰 Payment</a>

            <a href="/meal" class="btn btn-light">🍽 Meal</a>

            <a href="/summary" class="btn btn-light">📊 Summary</a>

        </div>

    </div>

    <div class="container py-4">

        <div class="card shadow mb-4">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h3 class="mb-0">👥 Members</h3>

                        <small class="text-muted">
                            Manage all mess members
                        </small>

                    </div>

                    <span class="badge bg-primary fs-6">
                        Total: {{ members|length }}
                    </span>

                </div>

                <form action="/add_member" method="POST">

                    <div class="mb-3">

                        <input type="text" name="name" class="form-control" placeholder="Member Name" required>

                    </div>

                    <div class="mb-3">

                        <input type="password" name="password" class="form-control" placeholder="Password" required>

                    </div>

                    <button class="btn btn-primary w-100 mb-4">
                        ➕ Add Member
                    </button>

                </form>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-primary">

                            <tr>

                                <th width="70">SL</th>

                                <th>Member Name</th>

                                <th class="text-center">Action</th>

                            </tr>

                        </thead>

                        <tbody>
                            {% for member in members %}

                            <tr>

                                <td>{{ loop.index }}</td>

                                <td>
                                    <strong>{{ member.name }}</strong>
                                </td>

                                <td class="text-center">

                                    <a href="/profile/{{ member.id }}" class="btn btn-primary btn-sm mb-1">
                                        👤 Profile
                                    </a>

                                    <a href="/edit_member/{{ member.id }}" class="btn btn-warning btn-sm mb-1">
                                        ✏️ Edit
                                    </a>

                                    <a href="/delete_member/{{ member.id }}" class="btn btn-danger btn-sm mb-1"
                                        onclick="return confirm('Are you sure you want to delete this member?')">
                                        🗑 Delete
                                    </a>

                                </td>

                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

</body>

</html>
