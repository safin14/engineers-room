<!DOCTYPE html>
<html>

<head>

    <title>Edit Meal</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .topbar {
            background: linear-gradient(135deg, #fd7e14, #198754);
            color: white;
            padding: 20px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="topbar text-center">

        <h3>🍽 Edit Meal</h3>

        <p class="mb-0">ENGINEERS ROOM</p>

    </div>

    <div class="container py-4">

        <div class="card shadow">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            🌅 Morning Meal
                        </label>

                        <input type="number" name="morning" class="form-control" value="{{ meal.morning }}" min="0"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            🌙 Night Meal
                        </label>

                        <input type="number" name="night" class="form-control" value="{{ meal.night }}" min="0"
                            required>

                    </div>

                    <button class="btn btn-success w-100">
                        💾 Update Meal
                    </button>

                </form>

                <hr>

                <a href="/meal" class="btn btn-secondary w-100">
                    ⬅ Back to Meal
                </a>

            </div>

        </div>

    </div>

</body>

</html>
